name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check common and NeoForge
        run: ./gradlew --console=plain :common:check :neoforge:check

      - name: Dedicated server smoke
        run: ./gradlew --console=plain runGameTestServer -PgameTestFilter=moveAcrossFlatGround,survivalRecruitmentRestrictsDeploymentButKeepsExistingGarrisons,classMultipliersApplyOnceToKillsDeferredRewardsAndSavedExperience -PgameTestReportName=ci-smoke

      - name: Keep server smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-smoke-report
          path: neoforge/build/reports/gameTest/ci-smoke/
          if-no-files-found: ignore

      - name: Build production artifact
        run: ./gradlew --console=plain build

      - name: Verify production artifact and pinned input
        run: python3 scripts/verify-release-artifact.py

  # The Fabric module builds the shared sources with Loom (preview: not part of a release yet).
  fabric:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the Fabric jar
        run: ./gradlew --console=plain -Ploader=fabric :fabric:build

      - name: Check the jar name
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          minecraft=$(sed -n 's/^minecraft_version=//p' gradle.properties)
          test -f "fabric/build/libs/sbwnpc-${version}-mc${minecraft}-fabric.jar"
