# Publishes a GitHub release with the mod jar when a version tag (v0.7.0, v0.7.0-beta.1) is pushed.
# Lint and tests run on the tagged commit first, so a failing tag never produces a release.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The jar name and the in-game version come from mod_version, so a tag that disagrees with it
      # would publish a release whose jar says something else.
      - name: Check tag matches mod_version
        run: |
          mod_version=$(sed -n 's/^mod_version=//p' gradle.properties)
          if [ "${GITHUB_REF_NAME#v}" != "$mod_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match mod_version=$mod_version in gradle.properties"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: gradle/actions/setup-gradle@v4

      # Linters register on check alongside the unit tests (ktlint's checkKotlinStyle on
      # feature/ai-architecture, detekt later), so this step picks them up without naming them.
      - name: Lint and test
        run: ./gradlew --console=plain check

      - name: Dedicated server smoke
        run: ./gradlew --console=plain runGameTestServer -PgameTestFilter=moveAcrossFlatGround,survivalRecruitmentRestrictsDeploymentButKeepsExistingGarrisons,classMultipliersApplyOnceToKillsDeferredRewardsAndSavedExperience -PgameTestReportName=release-smoke

      # Plain build is the production build: DebugFlags stay off.
      - name: Build
        run: ./gradlew --console=plain build

      - name: Verify production artifact and pinned input
        run: python3 scripts/verify-release-artifact.py

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          minecraft_version=$(sed -n 's/^minecraft_version=//p' gradle.properties)
          # The root build stages one jar per loader into build/libs, named by loader classifier
          # (sbwnpc-<version>-mc<mc>-neoforge.jar); every one of them goes into the release.
          shopt -s nullglob
          jars=(build/libs/"sbwnpc-${GITHUB_REF_NAME#v}-mc${minecraft_version}"-*.jar)
          if [ ${#jars[@]} -eq 0 ]; then
            echo "::error::No release jar in build/libs for ${GITHUB_REF_NAME#v}"
            exit 1
          fi
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" "${jars[@]}" --verify-tag --generate-notes "${prerelease[@]}"
