# Publishes a GitHub release with the mod jars (NeoForge, Fabric, Forge) when a version tag (v0.7.0,
# v0.7.0-beta.1) is pushed. Lint and tests run on the tagged commit first, so a failing tag never
# produces a release.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The jar name and the in-game version come from mod_version, so a tag that disagrees with it
      # would publish a release whose jar says something else.
      - name: Check tag matches mod_version
        run: |
          mod_version=$(sed -n 's/^mod_version=//p' gradle.properties)
          if [ "${GITHUB_REF_NAME#v}" != "$mod_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match mod_version=$mod_version in gradle.properties"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: gradle/actions/setup-gradle@v4

      # Linters register on check alongside the unit tests (ktlint's checkKotlinStyle on
      # feature/ai-architecture, detekt later), so this step picks them up without naming them.
      - name: Lint and test
        run: ./gradlew --console=plain check

      - name: Dedicated server smoke
        run: ./gradlew --console=plain runGameTestServer -PgameTestFilter=moveAcrossFlatGround,survivalRecruitmentRestrictsDeploymentButKeepsExistingGarrisons,classMultipliersApplyOnceToKillsDeferredRewardsAndSavedExperience -PgameTestReportName=release-smoke

      # Plain build is the production build: DebugFlags stay off. A Gradle run configures one loader and
      # stages only its jar into build/libs, so each loader is built and verified in turn and its jar is
      # collected into dist/ before the next build replaces build/libs.
      - name: Build
        run: ./gradlew --console=plain build

      - name: Verify production artifact and pinned input
        run: python3 scripts/verify-release-artifact.py

      - name: Collect the NeoForge jar
        run: mkdir -p dist && cp build/libs/*.jar dist/

      - name: Build the Fabric jar
        run: ./gradlew --console=plain -Ploader=fabric build

      - name: Verify the Fabric jar
        run: python3 scripts/verify-release-artifact.py --loader fabric

      - name: Collect the Fabric jar
        run: cp build/libs/*.jar dist/

      - name: Build the Forge jar
        run: ./gradlew --console=plain -Ploader=forge build

      - name: Verify the Forge jar
        run: python3 scripts/verify-release-artifact.py --loader forge

      - name: Collect the Forge jar
        run: cp build/libs/*.jar dist/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One jar per loader, named sbwnpc-<version>-mc<minecraft>-<loader>.jar; every one goes into the release.
          shopt -s nullglob
          jars=(dist/"sbwnpc-${GITHUB_REF_NAME#v}"-mc*-{neoforge,fabric,forge}.jar)
          if [ ${#jars[@]} -ne 3 ]; then
            echo "::error::Expected a NeoForge, a Fabric and a Forge jar in dist/ for ${GITHUB_REF_NAME#v}, found ${#jars[@]}"
            exit 1
          fi
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" "${jars[@]}" --verify-tag --generate-notes "${prerelease[@]}"
